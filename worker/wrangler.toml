name = "ayuda-sismo"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Dos ritmos, uno por fuente:
#
#   17 */3 * * *  Pulso de prensa. Cada 3 horas, no por visita: así el visitante
#                 nunca paga la latencia de 17 consultas a Google News ni de la
#                 lectura del modelo, y el gasto no crece con el tráfico.
#   40 11 * * *   Copernicus EMS (daño evaluado desde satélite), una vez al día
#                 a las 06:40 de Colombia. El servicio entrega uno o dos
#                 productos nuevos por día; consultarlo cada 3 horas sería
#                 traer catorce veces exactamente lo mismo.
#
# ⚠️ Las dos expresiones están repetidas en `src/index.js` (CRON_PRENSA y
# CRON_DIARIO) porque el Worker las usa para saber qué tarea le toca. Cambiar
# una sin la otra deja Copernicus sin actualizarse y sin ningún error visible.
[triggers]
crons = ["17 */3 * * *", "40 11 * * *"]

# La base de datos se crea con:
#   npx wrangler d1 create ayuda-sismo
# y el id que imprime ese comando va acá abajo.
[[d1_databases]]
binding = "DB"
database_name = "ayuda-sismo"
database_id = "e7a0d228-d793-4728-94b4-da2c79d45f35"

# Fotos de mascotas y de personas buscadas · DESACTIVADO al 13-ago-2026.
#
# R2 todavía no está habilitado en la cuenta (la API responde 10042 "Please
# enable R2 through the Cloudflare Dashboard") y eso hay que activarlo a mano
# en el panel. Con el binding declarado y el bucket inexistente, el deploy
# falla entero, así que se comenta para poder publicar el mapa.
#
# Para activarlo: habilitar R2 en el panel de Cloudflare, luego
#   npx wrangler r2 bucket create ayuda-sismo-fotos
# y descomentar estas tres líneas + volver a desplegar. El Worker publica la
# capacidad en /snapshot.json y el formulario vuelve a mostrar el campo solo.
# [[r2_buckets]]
# binding = "FOTOS"
# bucket_name = "ayuda-sismo-fotos"

[vars]
# A dónde apunta el enlace privado que recibe el reportante por correo.
SITIO = "https://sismo.ricardoruiz.co"
# La propia URL del Worker. Se usa solo para purgar el snapshot del edge
# cuando moderación oculta algo; si se deja vacío, el cambio entra al minuto.
API_BASE = "https://ayuda-sismo.reruizc.workers.dev"
# Hoja de centros de acopio publicada como CSV. Se puede cambiar sin tocar
# código: es lo que permite que otra organización use su propia hoja.
ACOPIOS_CSV = "https://docs.google.com/spreadsheets/d/1dj1fNYuwGMW0zLit4I6w_5abJGxuGVZttwA1QMbvQts/export?format=csv"
RESEND_FROM = "Mapa de ayuda <hola@ricardoruiz.co>"

# Secretos (NO van acá — se cargan con `wrangler secret put`):
#   ADMIN_TOKEN        obligatorio para las rutas /admin/*
#   IP_SALT            sal del hash de IP (cualquier cadena larga y aleatoria)
#   TURNSTILE_SECRET   anti-bot; sin él se reciben reportes igual, marcados
#                      `sin_captcha` para revisión
#   RESEND_API_KEY     opcional; sin él, el aviso al reportante es solo el
#                      enlace privado que ve al enviar
